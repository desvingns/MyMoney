name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: Lint, JVM tests, static analysis, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize Sentry DSN only when the OQ-1 secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -n "$SENTRY_DSN" ]]; then
            printf '%s\n' "sentry.dsn=$SENTRY_DSN" >> local.properties
          else
            echo "OQ-1 unresolved or no CI secret supplied: Sentry remains disabled."
          fi

      - name: Materialize Dropbox app key only when the secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [[ -n "$DROPBOX_APP_KEY" ]]; then
            printf '%s\n' "dropbox.appKey=$DROPBOX_APP_KEY" >> local.properties
          else
            echo "No CI secret supplied: Dropbox app key stays on the placeholder."
          fi

      - name: Materialize Firebase config only when the OQ-9 secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_ARGS=-Pfirebase.enabled=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_ARGS=" >> "$GITHUB_ENV"
            echo "OQ-9 unresolved or no CI secret supplied: live Firebase remains disabled."
          fi

      - name: Run lint and all JVM unit tests
        run: ./gradlew lintDebug testDebugUnitTest $FIREBASE_ARGS --stacktrace

      - name: Run detekt static analysis
        run: ./gradlew detekt --stacktrace

      - name: Run ktlint formatting check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Generate Kover HTML coverage report
        run: ./gradlew koverHtmlReport --stacktrace

      - name: Verify Kover coverage thresholds
        run: ./gradlew koverVerify --stacktrace

      - name: Upload Kover HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
          if-no-files-found: warn

  release:
    name: Signed release APK and AAB
    runs-on: ubuntu-latest
    needs: jvm
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    concurrency:
      group: mymoney-release
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $semver_regex ]]; then
            echo "::error::Release ref must be an exact stable SemVer tag: vMAJOR.MINOR.PATCH."
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]; then
            echo "::error::The release tag must point at the checked-out commit."
            exit 1
          fi

          valid_tags="$(git tag --list | grep -E "$semver_regex" | sort -V || true)"
          head_valid_tags="$(git tag --points-at HEAD | grep -E "$semver_regex" || true)"
          head_valid_tag_count="$(printf '%s\n' "$head_valid_tags" | sed '/^$/d' | wc -l)"
          highest_valid_tag="$(printf '%s\n' "$valid_tags" | sed '/^$/d' | tail -n 1)"

          if [[ "$head_valid_tag_count" -ne 1 || "$head_valid_tags" != "$RELEASE_TAG" ]]; then
            echo "::error::The trigger must be the sole valid stable tag at HEAD."
            exit 1
          fi
          if [[ -z "$highest_valid_tag" || "$highest_valid_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::The trigger must be the highest valid stable tag visible to the checkout."
            exit 1
          fi

      - name: Materialize Sentry DSN only when the OQ-1 secret is supplied
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -n "$SENTRY_DSN" ]]; then
            printf '%s\n' "sentry.dsn=$SENTRY_DSN" >> local.properties
          else
            echo "OQ-1 unresolved or no CI secret supplied: Sentry remains disabled."
          fi

      - name: Materialize Dropbox app key only when the secret is supplied
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [[ -n "$DROPBOX_APP_KEY" ]]; then
            printf '%s\n' "dropbox.appKey=$DROPBOX_APP_KEY" >> local.properties
          else
            echo "No CI secret supplied: Dropbox app key stays on the placeholder."
          fi

      - name: Materialize release cloud-sync configuration
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SUPABASE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=()
          [[ -n "$DROPBOX_APP_KEY" ]] || missing+=(DROPBOX_APP_KEY)
          [[ -n "$SUPABASE_URL" ]] || missing+=(SUPABASE_URL)
          [[ -n "$SUPABASE_ANON_KEY" ]] || missing+=(SUPABASE_ANON_KEY)
          [[ -n "$SUPABASE_GOOGLE_WEB_CLIENT_ID" ]] || missing+=(SUPABASE_GOOGLE_WEB_CLIENT_ID)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing release cloud-sync secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          {
            printf 'dropbox.appKey=%s\n' "$DROPBOX_APP_KEY"
            printf 'supabase.url=%s\n' "$SUPABASE_URL"
            printf 'supabase.anonKey=%s\n' "$SUPABASE_ANON_KEY"
            printf 'supabase.googleWebClientId=%s\n' "$SUPABASE_GOOGLE_WEB_CLIENT_ID"
          } >> local.properties

      - name: Materialize Firebase config only when the OQ-9 secret is supplied
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_ARGS=-Pfirebase.enabled=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_ARGS=" >> "$GITHUB_ENV"
            echo "OQ-9 unresolved or no CI secret supplied: live Firebase remains disabled."
          fi

      - name: Materialize release signing config
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || missing+=("RELEASE_KEYSTORE_BASE64")
          [[ -n "$RELEASE_KEYSTORE_PASSWORD" ]] || missing+=("RELEASE_KEYSTORE_PASSWORD")
          [[ -n "$RELEASE_KEY_ALIAS" ]] || missing+=("RELEASE_KEY_ALIAS")
          [[ -n "$RELEASE_KEY_PASSWORD" ]] || missing+=("RELEASE_KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing release signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/mymoney-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "MYMONEY_RELEASE_KEYSTORE_PATH=$keystore_path"
            echo "MYMONEY_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "MYMONEY_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "MYMONEY_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease -Psync.playReleaseEnabled=true $FIREBASE_ARGS --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  play-internal:
    name: Play Internal staging AAB
    runs-on: ubuntu-latest
    needs: jvm
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    concurrency:
      group: mymoney-play-internal
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $semver_regex ]]; then
            echo "::error::Release ref must be an exact stable SemVer tag: vMAJOR.MINOR.PATCH."
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]; then
            echo "::error::The release tag must point at the checked-out commit."
            exit 1
          fi

          valid_tags="$(git tag --list | grep -E "$semver_regex" | sort -V || true)"
          head_valid_tags="$(git tag --points-at HEAD | grep -E "$semver_regex" || true)"
          head_valid_tag_count="$(printf '%s\n' "$head_valid_tags" | sed '/^$/d' | wc -l)"
          highest_valid_tag="$(printf '%s\n' "$valid_tags" | sed '/^$/d' | tail -n 1)"

          if [[ "$head_valid_tag_count" -ne 1 || "$head_valid_tags" != "$RELEASE_TAG" ]]; then
            echo "::error::The trigger must be the sole valid stable tag at HEAD."
            exit 1
          fi
          if [[ -z "$highest_valid_tag" || "$highest_valid_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::The trigger must be the highest valid stable tag visible to the checkout."
            exit 1
          fi

      - name: Materialize Play Internal runtime configuration
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.SUPABASE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=()
          [[ -n "$DROPBOX_APP_KEY" ]] || missing+=("DROPBOX_APP_KEY")
          [[ -n "$SUPABASE_URL" ]] || missing+=("SUPABASE_URL")
          [[ -n "$SUPABASE_ANON_KEY" ]] || missing+=("SUPABASE_ANON_KEY")
          [[ -n "$SUPABASE_GOOGLE_WEB_CLIENT_ID" ]] || missing+=("SUPABASE_GOOGLE_WEB_CLIENT_ID")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Play Internal runtime configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          {
            printf 'dropbox.appKey=%s\n' "$DROPBOX_APP_KEY"
            printf 'supabase.url=%s\n' "$SUPABASE_URL"
            printf 'supabase.anonKey=%s\n' "$SUPABASE_ANON_KEY"
            printf 'supabase.googleWebClientId=%s\n' "$SUPABASE_GOOGLE_WEB_CLIENT_ID"
          } >> local.properties

      - name: Materialize release signing config
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || missing+=("RELEASE_KEYSTORE_BASE64")
          [[ -n "$RELEASE_KEYSTORE_PASSWORD" ]] || missing+=("RELEASE_KEYSTORE_PASSWORD")
          [[ -n "$RELEASE_KEY_ALIAS" ]] || missing+=("RELEASE_KEY_ALIAS")
          [[ -n "$RELEASE_KEY_PASSWORD" ]] || missing+=("RELEASE_KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing release signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/mymoney-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "MYMONEY_RELEASE_KEYSTORE_PATH=$keystore_path"
            echo "MYMONEY_RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "MYMONEY_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "MYMONEY_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Play Internal staging AAB
        run: ./gradlew :app:bundleStaging -Psync.playInternalEnabled=true --stacktrace

      - name: Upload signed Play Internal staging AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-play-internal.aab
          path: app/build/outputs/bundle/staging/*.aab
          if-no-files-found: error

  connected:
    name: Connected tests - Pixel 6 API 34
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      !(github.event.pull_request.user.login == 'renovate[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'dependency-radar'))
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize Sentry DSN only when the OQ-1 secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -n "$SENTRY_DSN" ]]; then
            printf '%s\n' "sentry.dsn=$SENTRY_DSN" >> local.properties
          else
            echo "OQ-1 unresolved or no CI secret supplied: Sentry remains disabled."
          fi

      - name: Materialize Dropbox app key only when the secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          if [[ -n "$DROPBOX_APP_KEY" ]]; then
            printf '%s\n' "dropbox.appKey=$DROPBOX_APP_KEY" >> local.properties
          else
            echo "No CI secret supplied: Dropbox app key stays on the placeholder."
          fi

      - name: Materialize Firebase config only when the OQ-9 secret is supplied
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_ARGS=-Pfirebase.enabled=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_ARGS=" >> "$GITHUB_ENV"
            echo "OQ-9 unresolved or no CI secret supplied: live Firebase remains disabled."
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Per-module sequential steps on a single API 34 AVD (cheaper than 4 jobs).
      # Replaces the monolithic connectedDebugAndroidTest, which locally hung and
      # masked failures across modules. Each module has its own timeout; a hang or
      # failure in one module no longer hides the others, and reports always upload.
      - name: Run connected tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          # The emulator-runner exposes one script hook, so the per-module steps
          # live here as separate sequential gradle invocations on the same AVD.
          # Each is bounded by a shell `timeout` so a single hung module is killed
          # (non-zero exit -> red build) instead of stalling the whole suite; later
          # modules still run via `&&`-free sequencing under POSIX `sh` reporting.
          script: |
            status=0
            timeout 30m ./gradlew :app:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :core:designsystem:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :core:database:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :core:datastore:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :core:sync:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :core:network:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            timeout 20m ./gradlew :feature:lockscreen:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || { rc=$?; if [ "$status" -eq 0 ]; then status=$rc; fi; }
            exit $status

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-android-test-reports
          path: "**/build/reports/androidTests/connected/**"
          if-no-files-found: warn
