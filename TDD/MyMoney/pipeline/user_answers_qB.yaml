qB1_mvp_scope: full_monefy_clone
qB1_notes: |
  Full clone = MVP equals "production". Roadmap §13 will not have a small MVP slice;
  v1.0 is the full feature set. v1.1+ becomes purely gamification polish (since user
  picked aesthetic-only gaming in B4).

qB2_extra_screens:
  - onboarding_4_slides   # APK has onboarding_hero_1..4 + onboarding_step_1..4
  - transactions_list     # for edit/delete (not visible in screenshots but logically required)
qB2_notes: |
  NOT included: PIN lock-screen (user did NOT select it — but APK has USE_BIOMETRIC).
  Keep biometric in §8.2 Permissions, but make the lock-screen feature optional, only
  triggered if user opts in via Settings. NOT included: Premium paywall (B3 = no IAP).

qB3_monetization: free_no_iap_no_ads
qB3_notes: |
  Strip Google Play Billing entirely. Strip AdMob/AppLovin. Features that were Premium
  in original (recurring records, dark mode, passcode, multiple accounts beyond default
  cash, custom categories) all become free in this re-implementation. This simplifies §9
  Integrations (no billing SDK) and removes paywall-related screens from §4.

qB4_dynamic_id: A-13
qB4_question_ru: |
  Audience='gaming': планируется ли действительно слой геймификации (achievements,
  streaks, XP) или только анимационная эстетика?
qB4_answer: aesthetics_only
qB4_notes: |
  No streaks, no achievements, no XP, no pets, no missions. Treat "gaming" as a styling
  layer: spring animations on amount input keypress, haptic feedback on every CTA,
  success "ka-ching" sound on transaction save, confetti on hitting budget goal,
  joyful FAB press animation, donut chart segment grow-in animation, category-icon
  hover-grow on selection, page-transition shared-element transitions. List these
  explicitly in §6.5 Components and §4 (per-screen "Acceptance criteria").

