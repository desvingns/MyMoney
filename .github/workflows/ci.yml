name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, JVM tests, and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize Firebase config only when the OQ-9 secret is supplied
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_ARGS=-Pfirebase.enabled=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_ARGS=" >> "$GITHUB_ENV"
            echo "OQ-9 unresolved or no CI secret supplied: live Firebase remains disabled."
          fi

      - name: Run lint, all JVM unit tests, and release assembly
        run: ./gradlew lintDebug testDebugUnitTest :app:assembleRelease $FIREBASE_ARGS --stacktrace

      - name: Run detekt static analysis
        run: ./gradlew detekt --stacktrace

      - name: Run ktlint formatting check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Verify Kover coverage thresholds
        run: ./gradlew koverVerify --stacktrace

      # The release APK is intentionally unsigned: signing requires the release
      # keystore, which is an external gate (OQ — see TDD §14.2). The "-unsigned"
      # name keeps that state explicit for anyone downloading the artifact.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  connected:
    name: Connected tests - Pixel 6 API 34
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize Firebase config only when the OQ-9 secret is supplied
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_ARGS=-Pfirebase.enabled=true" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_ARGS=" >> "$GITHUB_ENV"
            echo "OQ-9 unresolved or no CI secret supplied: live Firebase remains disabled."
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Per-module sequential steps on a single API 34 AVD (cheaper than 4 jobs).
      # Replaces the monolithic connectedDebugAndroidTest, which locally hung and
      # masked failures across modules. Each module has its own timeout; a hang or
      # failure in one module no longer hides the others, and reports always upload.
      - name: Run connected tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          # The emulator-runner exposes one script hook, so the per-module steps
          # live here as separate sequential gradle invocations on the same AVD.
          # Each is bounded by a shell `timeout` so a single hung module is killed
          # (non-zero exit -> red build) instead of stalling the whole suite; later
          # modules still run via `&&`-free sequencing under `set +e` reporting.
          script: |
            set -o pipefail
            status=0
            timeout 30m ./gradlew :app:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || status=$?
            timeout 20m ./gradlew :core:designsystem:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || status=$?
            timeout 20m ./gradlew :core:database:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || status=$?
            timeout 20m ./gradlew :core:datastore:connectedDebugAndroidTest $FIREBASE_ARGS --stacktrace || status=$?
            exit $status

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-android-test-reports
          path: "**/build/reports/androidTests/connected/**"
          if-no-files-found: warn
