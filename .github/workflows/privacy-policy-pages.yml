name: Sync privacy policy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "privacy-policy/**"
      - ".github/workflows/privacy-policy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated Pages content
        run: |
          mkdir -p "$RUNNER_TEMP/privacy-policy-pages/privacy-policy"
          cp -R privacy-policy/. "$RUNNER_TEMP/privacy-policy-pages/privacy-policy/"

      - name: Update the Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cp -R "$RUNNER_TEMP/privacy-policy-pages/privacy-policy/." "$RUNNER_TEMP/gh-pages/privacy-policy/"
          git -C "$RUNNER_TEMP/gh-pages" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/gh-pages" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/gh-pages" add privacy-policy
          if git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet; then
            echo "Pages content is already up to date."
          else
            git -C "$RUNNER_TEMP/gh-pages" commit -m "docs: sync privacy policy pages"
            git -C "$RUNNER_TEMP/gh-pages" push origin HEAD:gh-pages
          fi
